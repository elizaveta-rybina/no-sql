services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra_db
    ports:
      - '9042:9042' # CQL порт
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_NUM_TOKENS=128
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ['CMD-SHELL', "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cassandra_network

  cassandra-web:
    build: .
    container_name: cassandra_web
    ports:
      - '3000:3000' # Веб-интерфейс
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_DC=datacenter1
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - cassandra_network

volumes:
  cassandra_data:
    driver: local

networks:
  cassandra_network:
    driver: bridge
